name: Test
run-name: Test

# Every branch is built on push, not just main: the auto-merge drain gates each
# branch on a green Test run for that branch's exact tip, and a branch with no
# open PR would otherwise never get a run at all — so it could never merge.
# pull_request still covers forks, whose pushes land in the fork, not here.
# workflow_dispatch lets auto-merge-to-main.yml request a run on main after it
# pushes (a GITHUB_TOKEN push triggers no workflows of its own).
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # act-local-CI only. GitHub's ubuntu-latest ships shellcheck preinstalled;
      # act's runner image (catthehacker/ubuntu:act-latest) does not, so this job
      # died with exit 127 under the global `act push` pre-push hook — blocking
      # every push for a reason unrelated to the code. `env.ACT` is set only by
      # act and is unset on GitHub-hosted runners, so this is skipped there and
      # cannot change real CI. `== 'true'` rather than a bare truthiness test,
      # because GitHub treats ANY non-empty string (including "false") as true;
      # the in-script re-check is a second guard so a misfiring `if:` degrades to
      # a no-op instead of failing the job on a transient apt error.
      - name: Install shellcheck (act-local CI only — GitHub's runner already has it)
        if: ${{ env.ACT == 'true' }}
        run: |
          set -euo pipefail
          [ "${ACT:-}" = "true" ] || exit 0
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq shellcheck
          fi

      - name: Run shellcheck
        run: |
          shellcheck --version
          make lint

  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install shfmt
        run: |
          curl -fsSLo shfmt https://github.com/mvdan/sh/releases/download/v3.8.0/shfmt_v3.8.0_linux_amd64
          echo "27b3c6f9d9592fc5b4856c341d1ff2c88856709b9e76469313642a1d7b558fe0  shfmt" | sha256sum -c
          chmod +x shfmt
          sudo mv shfmt /usr/local/bin/
          shfmt --version

      - name: Check formatting
        run: make format-check

  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Homebrew (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -fsSLo /tmp/homebrew-install.sh https://raw.githubusercontent.com/Homebrew/install/93a25fd2d2fdb86422303c292b9223f84ef23eaf/install.sh
          echo "17f204b128869ec71e6b650051f1e65ef5b74cf994c2ff8b919103241554dd2f  /tmp/homebrew-install.sh" | sha256sum -c
          /bin/bash /tmp/homebrew-install.sh </dev/null
          echo "/home/linuxbrew/.linuxbrew/bin" >> $GITHUB_PATH
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"

      - name: Install dependencies
        run: make install-deps

      - name: Run tests
        run: make test

      # Informational only. coverage.sh runs under `set -euo pipefail`, so it
      # could abort on e.g. a file that moved; continue-on-error makes "this
      # never fails the job" an enforced property rather than an assumption
      # about the script. One matrix row is enough; the report is
      # platform-independent.
      - name: Print coverage report
        if: runner.os == 'Linux'
        continue-on-error: true
        run: bash dev/coverage.sh
